name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ["stores/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_site.py
      # 그룹별 경로 분리: /<group>/<store-id>/
      - name: Assemble
        run: |
          for g in stores/*/; do
            name=$(basename "$g")
            [ -d "$g/output/site" ] && mkdir -p "_site/$name" && cp -r "$g/output/site/." "_site/$name/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
